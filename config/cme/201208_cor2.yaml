base_path: "/glade/work/rjarolim/sunerf-cme-obs/201208_cor2_v05"
work_directory: '/glade/derecho/scratch/rjarolim/sunerf-cme-obs/201208_cor2_v05'

instruments:
  - type: 'default'
    key: 'STEREO_A_COR2'
    scaling: {type: 'log'}
    correction: { corrections: ['f_corona'] }
    calibration: False
    alignment: False
  - type: 'default'
    key: 'STEREO_B_COR2'
    scaling: { type: 'log' }
    correction: { corrections: ['calibration_gain', 'f_corona', 'pB_mul'] }
    calibration: False
    alignment: False

model:
  dim: 128
  static: False
  encoding_config: {type: multi_spectral, weights: [10, 10, 10, 1]}

data:
  train_datasets:
    - type: 'COR'
      key: 'STEREO_A_COR2'
      instrument_key: 'STEREO_A_COR2'
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/2012_08/prep/stereo_a_cor2/pB/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2012_08/prep/stereo_a_cor2/tB/*"
      batch_size: 1024
      debug: False
    - type: 'COR'
      key: 'STEREO_B_COR2'
      instrument_key: 'STEREO_B_COR2'
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/2012_08/prep/stereo_b_cor2/pB/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2012_08/prep/stereo_b_cor2/tB/*"
      batch_size: 1024
      debug: False
    - type: 'random'
      name: 'continuity'
      radius_range: [ 1.5, 17.0 ]
      unit: 'solRad'
      batch_size: 4096
  valid_datasets:
    - type: 'COR'
      key: 'STEREO_A_COR2'
      instrument_key: 'STEREO_A_COR2'
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/2012_08/prep/stereo_a_cor2/pB/20120815_100815_1P4c2A.fts"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2012_08/prep/stereo_a_cor2/tB/20120815_100815_1B4c2A.fts"
    - type: 'COR'
      key: 'STEREO_B_COR2'
      instrument_key: 'STEREO_B_COR2'
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/2012_08/prep/stereo_b_cor2/pB/20120815_100815_1P4c2B.fts"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2012_08/prep/stereo_b_cor2/tB/20120815_100815_1B4c2B.fts"
    - type: 'series'
      name: 'series'
      batch_size: 16384
      radius_range: [ 2, 15.0 ]
  debug: False
  Rs_per_ds: 15
  seconds_per_dt: 100000
  batch_size: 4096
  validation_batch_size: 4096
  num_workers: 16

callbacks:
  # image callbacks
  - type: 'thomson_image'
    ds_key: 'STEREO_A_COR2'
  - type: 'thomson_image'
    ds_key: 'STEREO_B_COR2'
  # correction images
  - type: 'correction_image'
    ds_key: 'STEREO_A_COR2'
  - type: 'correction_image'
    ds_key: 'STEREO_B_COR2'
  - type: 'velocity_slice'
    name: 'velocity_slice'
    ds_key: 'series'
    latitude: 0

logging:
  entity: "robert_jarolim"
  project: "sunerf-cme-obs"
  name: "2024-10 - COR2"

sampling:
  type: "spherical"
  n_samples: 64
  max_distance: 17.0

lambda:
  image: 1.0
  ratio: 10.0
  radial: 1.0e-4
  continuity: 1.0e-5
  velocity: 1.0e-4

training:
  log_every_n_steps: 2000