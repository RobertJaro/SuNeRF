base_path: "/glade/work/rjarolim/sunerf-cme-obs/psi_obs/punch_l5/degraded_gain_2view_v05"
work_directory: "/glade/derecho/scratch/rjarolim/sunerf-cme-obs/psi_obs/punch_l5/degraded_gain_2view_v05"

# Synthetic PSI views: PUNCH (L5), L5 (CCOR, tB only), L4 (COR2); polar P1 held out.
# Training views degraded by scripts/psi_test/prepare_data.sh (additive, gain, noise).
instruments:
  - type: default
    key: PUNCH
    scaling: { type: "asinh", a: 1.0e-5 }
    correction:
      corrections: [tB_add, pB_add, tB_mul, pB_mul]
      additive_parametrization: exp  # add = scale * a * exp(b), sign carried by a
      additive_scale: 1.0e-5
  - type: default
    key: L5
    scaling: { type: "asinh", a: 1.0e-3 }
    correction:
      corrections: [tB_add, tB_mul]
      additive_parametrization: exp
      additive_scale: 1.0e-3
  - type: default
    key: L4
    scaling: { type: "asinh", a: 1.0e-3 }
    correction:
      corrections: [tB_add, pB_add, tB_mul, pB_mul]
      additive_parametrization: exp
      additive_scale: 1.0e-3
  - type: default
    key: P1
    scaling: { type: "asinh", a: 1.0e-3 }

# Long cold phase: the additive masks converge before the dynamic branch is on.
model:
  model_type: split_temporal
  cold_steps: 10000
  warm_steps: 5000

module:
  # Each synthetic image integrates one density snapshot.
  light_travel_time: false
  lr_config: { start: 1.0e-3, end: 1.0e-4, iterations: 200000 }

data:
  # First of 20 pre-event days (80 frames at 6 h) before the eruption.
  ref_date: "2021-10-08T15:30:00"
  cme_time: &cme_time ["2021-10-28T15:30:00", "2021-11-03T15:31:12"]
  # Coronal dump 50 falls within the overlap of both density releases.
  valid_time: &valid_time "2021-10-28T19:35:00"
  # Use the full sequence for the background and every available CME frame.
  train_datasets:
    - type: psi_cme
      key: PUNCH_background
      instrument_key: PUNCH
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/degraded_gain/PUNCH/pb/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/degraded_gain/PUNCH/tb/*"
      batch_size: 512
      debug: false
    - type: psi_cme
      key: PUNCH_cme
      instrument_key: PUNCH
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/degraded_gain/PUNCH/pb/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/degraded_gain/PUNCH/tb/*"
      time_range: *cme_time
      batch_size: 512
      debug: false
    - type: psi_cme
      key: L5_background
      instrument_key: L5
      data_path_pB: null
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/degraded_gain/L5/tb/*"
      batch_size: 512
      debug: false
    - type: psi_cme
      key: L5_cme
      instrument_key: L5
      data_path_pB: null
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/degraded_gain/L5/tb/*"
      time_range: *cme_time
      batch_size: 512
      debug: false
    - type: psi_cme
      key: L4_background
      instrument_key: L4
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/degraded_gain/L4/pb/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/degraded_gain/L4/tb/*"
      batch_size: 512
      debug: false
    - type: psi_cme
      key: L4_cme
      instrument_key: L4
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/degraded_gain/L4/pb/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/degraded_gain/L4/tb/*"
      time_range: *cme_time
      batch_size: 512
      debug: false
    - type: random
      key: random_background
      radius_range: [1.5, 160.0]
      unit: solRad
      batch_size: 2048
      volume_uniform_sampling: true
      radial_sampling_exponent: 1
    - type: random
      key: random_cme
      time_range: *cme_time
      radius_range: [1.5, 160.0]
      unit: solRad
      batch_size: 2048
      volume_uniform_sampling: true
      radial_sampling_exponent: 1

  valid_datasets:
    - type: psi_cme
      key: PUNCH
      instrument_key: PUNCH
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/degraded_gain/PUNCH/pb/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/degraded_gain/PUNCH/tb/*"
      validation_time: *valid_time
    - type: psi_cme
      key: L5
      instrument_key: L5
      data_path_pB: null
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/degraded_gain/L5/tb/*"
      validation_time: *valid_time
    - type: psi_cme
      key: L4
      instrument_key: L4
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/degraded_gain/L4/pb/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/degraded_gain/L4/tb/*"
      validation_time: *valid_time
    - type: psi_cme
      key: P1
      instrument_key: P1
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/clean/P1/pb/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/clean/P1/tb/*"
      validation_time: *valid_time
    - type: radial_slices
      key: valid_radial
      radii: [3, 5, 10, 20, 50, 80]
    - type: longitude_slices
      key: valid_lon_slices
      radius_range: [2.5, 100.0]

  Rs_per_ds: 100
  seconds_per_dt: 86400
  batch_size: 4096
  validation_batch_size: 4096
  num_workers: 4
  preprocess_workers: 32

callbacks:
  - type: thomson_image
    ds_key: PUNCH
  - type: thomson_image
    ds_key: L5
  - type: thomson_image
    ds_key: L4
  - type: thomson_image
    ds_key: P1
  - type: correction_image
    ds_key: PUNCH
  - type: correction_image
    ds_key: L5
  - type: correction_image
    ds_key: L4
  - type: radial_slices
    ds_key: valid_radial
  - type: longitude_density
    ds_key: valid_lon_slices

logging:
  entity: robert_jarolim
  project: sunerf-cme-obs-v4
  name: "PSI obs degraded+gain 2-view PUNCH/CCOR/COR2 - P1 held out"

sampling:
  type: spherical
  n_samples: 64
  max_distance: 150.0
  radial_weighting: true

lambda:
  image: 1.0
  ratio: 1.0
  # No priors on the image-plane fields; smoothness comes from the correction network.
  tB_add: 0.0
  pB_add: 0.0
  tB_mul: 0.0
  pB_mul: 0.0
  calibration: 0.0
  radial: 1.0
  continuity: { start: 1.0e-2, end: 5.0e-4, iterations: 5.0e+4 }
  ballistic: 0.0
  velocity: 1.0
  insitu_density: 0.0
  insitu_velocity_radial: 0.0

training:
  log_every_n_steps: 10000
