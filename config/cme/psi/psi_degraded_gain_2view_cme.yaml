base_path: "/glade/work/rjarolim/sunerf-cme-obs/psi_obs/degraded_gain_2view_cme_v01"
work_directory: "/glade/derecho/scratch/rjarolim/sunerf-cme-obs/psi_obs/degraded_gain_2view_cme_v01"

# Synthetic PSI views: L5_wide (PUNCH), L5 (CCOR, tB only), L4 (COR2); polar P1 held out.
# Training views degraded by scripts/psi_test/prepare_data.sh (additive, gain, noise).
# Stage 2 of 2: continues from psi_degraded_gain_2view_background.yaml with fixed degradation fields.
instruments:
  - type: default
    key: L5_wide
    scaling: { type: "asinh", a: 1.0e-5 }
    correction:
      corrections: [tB_add, pB_add, tB_mul, pB_mul]
      additive_parametrization: exp  # add = scale * a * exp(b), sign carried by a
      additive_scale: 1.0e-5
      trainable: false
  - type: default
    key: L5
    scaling: { type: "asinh", a: 1.0e-3 }
    correction:
      corrections: [tB_add, tB_mul]
      additive_parametrization: exp
      additive_scale: 1.0e-3
      trainable: false
  - type: default
    key: L4
    scaling: { type: "asinh", a: 1.0e-3 }
    correction:
      corrections: [tB_add, pB_add, tB_mul, pB_mul]
      additive_parametrization: exp
      additive_scale: 1.0e-3
      trainable: false
  - type: default
    key: P1
    scaling: { type: "asinh", a: 1.0e-3 }

# Both branches come from stage 1; the dynamic branch is active from step 0.
model:
  model_type: split_temporal
  cold_steps: 0
  warm_steps: 0

module:
  light_travel_time: false
  lr_config: { start: 1.0e-3, end: 1.0e-4, iterations: 200000 }

data:
  # First of 20 pre-event days (80 frames at 6 h) before the eruption.
  ref_date: "2021-10-08T15:30:00"
  cme_time: &cme_time ["2021-10-28T15:30:00", "2021-10-29T03:30:00"]
  # Per view: 6 h background series plus every eruption frame.
  train_datasets:
    - type: psi_cme
      key: L5_wide_background
      instrument_key: L5_wide
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs/degraded_gain/L5_wide/pb/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs/degraded_gain/L5_wide/tb/*"
      cadence: "6h"
      batch_size: 512
      debug: false
    - type: psi_cme
      key: L5_wide_cme
      instrument_key: L5_wide
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs/degraded_gain/L5_wide/pb/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs/degraded_gain/L5_wide/tb/*"
      time_range: *cme_time
      batch_size: 512
      debug: false
    - type: psi_cme
      key: L5_background
      instrument_key: L5
      data_path_pB: null
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs/degraded_gain/L5/tb/*"
      cadence: "6h"
      batch_size: 512
      debug: false
    - type: psi_cme
      key: L5_cme
      instrument_key: L5
      data_path_pB: null
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs/degraded_gain/L5/tb/*"
      time_range: *cme_time
      batch_size: 512
      debug: false
    - type: psi_cme
      key: L4_background
      instrument_key: L4
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs/degraded_gain/L4/pb/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs/degraded_gain/L4/tb/*"
      cadence: "6h"
      batch_size: 1024
      debug: false
    - type: psi_cme
      key: L4_cme
      instrument_key: L4
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs/degraded_gain/L4/pb/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs/degraded_gain/L4/tb/*"
      time_range: *cme_time
      batch_size: 1024
      debug: false
    - type: random
      time_range: *cme_time
      radius_range: [1.5, 30.2]
      unit: solRad
      batch_size: 4096
      volume_uniform_sampling: true
      radial_sampling_exponent: 2

  # Frame 0130 renders cube 50.
  valid_datasets:
    - type: psi_cme
      key: L5_wide
      instrument_key: L5_wide
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs/degraded_gain/L5_wide/pb/L5_wide_pb0130.fts"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs/degraded_gain/L5_wide/tb/L5_wide_tb0130.fts"
    - type: psi_cme
      key: L5
      instrument_key: L5
      data_path_pB: null
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs/degraded_gain/L5/tb/L5_tb0130.fts"
    - type: psi_cme
      key: L4
      instrument_key: L4
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs/degraded_gain/L4/pb/L4_pb0130.fts"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs/degraded_gain/L4/tb/L4_tb0130.fts"
    - type: psi_cme
      key: P1
      instrument_key: P1
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs/clean/P1/pb/P1_pb0130.fts"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs/clean/P1/tb/P1_tb0130.fts"
    - type: radial_slices
      key: valid_radial
      radii: [5, 10, 15, 20, 25]
      validation_time_range: *cme_time
    - type: longitude_slices
      key: valid_lon_slices
      radius_range: [2.0, 30.0]
      validation_time_range: *cme_time

  Rs_per_ds: 15
  seconds_per_dt: 86400
  batch_size: 4096
  validation_batch_size: 4096
  num_workers: 4

callbacks:
  - type: thomson_image
    ds_key: L5_wide
  - type: thomson_image
    ds_key: L5
  - type: thomson_image
    ds_key: L4
  - type: thomson_image
    ds_key: P1
  - type: correction_image
    ds_key: L5_wide
  - type: correction_image
    ds_key: L5
  - type: correction_image
    ds_key: L4
  - type: radial_slices
    ds_key: valid_radial
  - type: longitude_density
    ds_key: valid_lon_slices

logging:
  entity: robert_jarolim
  project: sunerf-cme-obs-v4
  name: "PSI obs degraded+gain 2-view PUNCH/CCOR/COR2 - stage 2 CME, fixed degradation - P1 held out"

sampling:
  type: spherical
  n_samples: 64
  max_distance: 30.2
  radial_weighting: true

lambda:
  image: 1.0
  ratio: 1.0
  # No priors on the image-plane fields; smoothness comes from the correction network.
  tB_add: 0.0
  pB_add: 0.0
  tB_mul: 0.0
  pB_mul: 0.0
  continuity: 1.0e-3
  ballistic: 0.0
  velocity: 1.0
  radial: 1.0
training:
  log_every_n_steps: 1000
  # Weights only; optimizer and step count start fresh.
  init_path: "/glade/work/rjarolim/sunerf-cme-obs/psi_obs/degraded_gain_2view_background_v01/final.ckpt"
