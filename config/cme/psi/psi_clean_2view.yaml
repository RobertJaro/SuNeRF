base_path: "/glade/work/rjarolim/sunerf-cme-obs/psi_obs/punch_l5/clean_2view_v01"
work_directory: "/glade/derecho/scratch/rjarolim/sunerf-cme-obs/psi_obs/punch_l5/clean_2view_v01"

# PSI views in the FOV of PUNCH (L5), CCOR (L5, tB only), COR2 (L4).
# Clean training views; polar view P1 held out.
instruments:
  - type: default
    key: PUNCH
    scaling: { type: "asinh", a: 1.0e-5 }
  - type: default
    key: L5
    scaling: { type: "asinh", a: 1.0e-3 }
  - type: default
    key: L4
    scaling: { type: "asinh", a: 1.0e-3 }
  - type: default
    key: P1
    scaling: { type: "asinh", a: 1.0e-3 }

model:
  model_type: split_temporal
  cold_steps: 5000
  warm_steps: 5000

module:
  light_travel_time: false
  # SIREN volumes are unstable at the 1e-3 default learning rate.
  lr_config: { start: 2.0e-4, end: 2.0e-5, iterations: 200000 }

data:
  # 20 pre-event days (80 frames at 6 h) precede the eruption.
  ref_date: "2021-10-08T15:30:00"
  cme_time: &cme_time ["2021-10-28T15:30:00", "2021-11-03T15:31:12"]
  # Each view: 6 h background dataset plus full-cadence CME dataset.
  train_datasets:
    - type: psi_cme
      key: PUNCH_background
      instrument_key: PUNCH
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/clean/PUNCH/pb/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/clean/PUNCH/tb/*"
      cadence: "6h"
      batch_size: 512
      debug: false
    - type: psi_cme
      key: PUNCH_cme
      instrument_key: PUNCH
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/clean/PUNCH/pb/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/clean/PUNCH/tb/*"
      time_range: *cme_time
      batch_size: 512
      debug: false
    - type: psi_cme
      key: L5_background
      instrument_key: L5
      data_path_pB: null
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/clean/L5/tb/*"
      cadence: "6h"
      batch_size: 512
      debug: false
    - type: psi_cme
      key: L5_cme
      instrument_key: L5
      data_path_pB: null
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/clean/L5/tb/*"
      time_range: *cme_time
      batch_size: 512
      debug: false
    - type: psi_cme
      key: L4_background
      instrument_key: L4
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/clean/L4/pb/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/clean/L4/tb/*"
      cadence: "6h"
      batch_size: 1024
      debug: false
    - type: psi_cme
      key: L4_cme
      instrument_key: L4
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/clean/L4/pb/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/clean/L4/tb/*"
      time_range: *cme_time
      batch_size: 1024
      debug: false
    - type: random
      radius_range: [1.5, 236.46]
      unit: solRad
      batch_size: 4096
      volume_uniform_sampling: true
      radial_sampling_exponent: 2

  # Frame 0130 follows the 80 pre-event frames and renders cube 50.
  valid_datasets:
    - type: psi_cme
      key: PUNCH
      instrument_key: PUNCH
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/clean/PUNCH/pb/PUNCH_pb0130.fts"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/clean/PUNCH/tb/PUNCH_tb0130.fts"
    - type: psi_cme
      key: L5
      instrument_key: L5
      data_path_pB: null
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/clean/L5/tb/L5_tb0130.fts"
    - type: psi_cme
      key: L4
      instrument_key: L4
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/clean/L4/pb/L4_pb0130.fts"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/clean/L4/tb/L4_tb0130.fts"
    - type: psi_cme
      key: P1
      instrument_key: P1
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/clean/P1/pb/P1_pb0130.fts"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/psi_obs_render/clean/P1/tb/P1_tb0130.fts"
    - type: radial_slices
      key: valid_radial
      radii: [5, 10, 15, 20, 25]
      validation_time_range: *cme_time
    - type: longitude_slices
      key: valid_lon_slices
      radius_range: [2.0, 30.0]
      validation_time_range: *cme_time

  Rs_per_ds: 15
  seconds_per_dt: 86400
  batch_size: 4096
  validation_batch_size: 4096
  num_workers: 4

callbacks:
  - type: thomson_image
    ds_key: PUNCH
  - type: thomson_image
    ds_key: L5
  - type: thomson_image
    ds_key: L4
  - type: thomson_image
    ds_key: P1
  - type: radial_slices
    ds_key: valid_radial
  - type: longitude_density
    ds_key: valid_lon_slices

logging:
  entity: robert_jarolim
  project: sunerf-cme-obs-v4
  name: "PSI obs clean 2-view PUNCH/CCOR/COR2 - P1 held out"

sampling:
  type: spherical
  n_samples: 64
  max_distance: 30.2
  max_distance_by_instrument: {PUNCH: 236.46}
  radial_weighting: true

lambda:
  image: 1.0
  ratio: 1.0
  radial: 1.0
  continuity: 1.0e-3
  ballistic: 0.0
  velocity: 1.0

training:
  log_every_n_steps: 1000
