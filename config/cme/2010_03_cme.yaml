base_path: "/glade/work/rjarolim/sunerf-cme-obs/2010_03_cme_v02"
work_directory: '/glade/derecho/scratch/rjarolim/sunerf-cme-obs/2010_03_cme_v02'

instruments:
  - type: 'default'
    key: 'STEREO_A_COR2'
    scaling: {type: 'asinh', a: 1.0e-3 }
    correction: { corrections: [ 'f_corona', 'pB_add', 'tB_add', 'pB_mul', 'tB_mul' ] }
  - type: 'default'
    key: 'STEREO_B_COR2'
    scaling: {type: 'asinh', a: 1.0e-3 }
    correction: { corrections: [ 'f_corona', 'pB_add', 'tB_add', 'pB_mul', 'tB_mul' ] }
  - type: 'default'
    key: 'LASCO_C2'
    scaling: {type: 'asinh', a: 1.0e-3 }
    correction: { corrections: [ 'f_corona', 'pB_add', 'tB_add', 'pB_mul', 'tB_mul' ] }
  - type: 'default'
    key: 'LASCO_C2_CLEAR'
    scaling: {type: 'asinh', a: 1.0e-3 }
    correction: { corrections: [ 'f_corona', 'tB_add', 'tB_mul' ] }

model:
  use_carrington_projection: True
  model_type: 'split_temporal'
  cold_steps: 0
  warm_steps: 2000

data:
  train_datasets:
    # Full time-series background frames for learned correction masks.
    - type: 'COR'
      key: 'STEREO_A_COR2_BACKGROUND'
      instrument_key: 'STEREO_A_COR2'
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_a_cor2/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_a_cor2/tB/*"
      cadence: "6h"
      batch_size: 256
      debug: False
      correction_config: { type: file, tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_a_cor2_tB_correction.npy", pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_a_cor2_pB_correction.npy" }
    - type: 'COR'
      key: 'STEREO_B_COR2_BACKGROUND'
      instrument_key: 'STEREO_B_COR2'
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_b_cor2/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_b_cor2/tB/*"
      cadence: "6h"
      batch_size: 256
      debug: False
      correction_config: { type: file, tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_b_cor2_tB_correction.npy", pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_b_cor2_pB_correction.npy" }
    - type: 'LASCO'
      key: 'LASCO_C2_BACKGROUND'
      instrument_key: 'LASCO_C2'
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/lasco_c2/pB/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/lasco_c2/tB/*"
      cadence: "6h"
      batch_size: 256
      debug: False
      correction_config: { type: file, tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/lasco_c2_tB_correction.npy", pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/lasco_c2_pB_correction.npy" }
    - type: 'LASCO'
      key: 'LASCO_C2_CLEAR_BACKGROUND'
      instrument_key: 'LASCO_C2_CLEAR'
      data_path_pB: null
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/lasco_c2_clear/tB/*"
      cadence: "6h"
      batch_size: 256
      debug: False
      correction_config: { type: file, tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/lasco_c2_clear_tB_correction.npy" }

    # CME-window fitting.
    - type: 'COR'
      key: 'STEREO_A_COR2'
      instrument_key: 'STEREO_A_COR2'
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_a_cor2/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_a_cor2/tB/*"
      time_range: [ "2010-03-19T00:00", "2010-03-21T00:00" ]
      batch_size: 256
      debug: False
      correction_config: { type: file, tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_a_cor2_tB_correction.npy", pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_a_cor2_pB_correction.npy" }
    - type: 'COR'
      key: 'STEREO_B_COR2'
      instrument_key: 'STEREO_B_COR2'
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_b_cor2/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_b_cor2/tB/*"
      time_range: [ "2010-03-19T00:00", "2010-03-21T00:00" ]
      batch_size: 256
      debug: False
      correction_config: { type: file, tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_b_cor2_tB_correction.npy", pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_b_cor2_pB_correction.npy" }
    - type: 'LASCO'
      key: 'LASCO_C2'
      instrument_key: 'LASCO_C2'
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/lasco_c2/pB/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/lasco_c2/tB/*"
      time_range: [ "2010-03-19T00:00", "2010-03-21T00:00" ]
      batch_size: 256
      debug: False
      correction_config: { type: file, tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/lasco_c2_tB_correction.npy", pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/lasco_c2_pB_correction.npy" }
    - type: 'LASCO'
      key: 'LASCO_C2_CLEAR'
      instrument_key: 'LASCO_C2_CLEAR'
      data_path_pB: null
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/lasco_c2_clear/tB/*"
      time_range: [ "2010-03-19T00:00", "2010-03-21T00:00" ]
      batch_size: 256
      debug: False
      correction_config: { type: file, tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/lasco_c2_clear_tB_correction.npy" }

    - type: 'random'
      name: 'continuity'
      radius_range: [ 1.5, 17.0 ]
      unit: 'solRad'
      batch_size: 4096
      volume_uniform_sampling: True


  valid_datasets:
    - type: 'COR'
      key: 'STEREO_A_COR2'
      instrument_key: 'STEREO_A_COR2'
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_a_cor2/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_a_cor2/tB/*"
      time_range: [ "2010-03-19T00:00", "2010-03-21T00:00" ]
      batch_size: 2048
      correction_config: { type: file, tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_a_cor2_tB_correction.npy", pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_a_cor2_pB_correction.npy" }

    - type: 'COR'
      key: 'STEREO_B_COR2'
      instrument_key: 'STEREO_B_COR2'
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_b_cor2/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_b_cor2/tB/*"
      time_range: [ "2010-03-19T00:00", "2010-03-21T00:00" ]
      batch_size: 2048
      correction_config: { type: file, tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_b_cor2_tB_correction.npy", pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_b_cor2_pB_correction.npy" }

    - type: 'LASCO'
      key: 'LASCO_C2'
      instrument_key: 'LASCO_C2'
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/lasco_c2/pB/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/lasco_c2/tB/*"
      time_range: [ "2010-03-19T00:00", "2010-03-21T00:00" ]
      batch_size: 2048
      correction_config: { type: file, tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/lasco_c2_tB_correction.npy", pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/lasco_c2_pB_correction.npy" }

    - type: 'LASCO'
      key: 'LASCO_C2_CLEAR'
      instrument_key: 'LASCO_C2_CLEAR'
      data_path_pB: null
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/lasco_c2_clear/tB/*"
      time_range: [ "2010-03-19T00:00", "2010-03-21T00:00" ]
      batch_size: 2048
      correction_config: { type: file, tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/lasco_c2_clear_tB_correction.npy" }

    - key: valid_radial
      type: radial_slices
      radii: [3, 6, 9, 12, 15]
      n_times: 5

    - type: longitude_slices
      key: valid_lon_slices
      radius_range: [ 2.5, 17.0 ]
      n_times: 5


  Rs_per_ds: 15
  seconds_per_dt: 86400
  batch_size: 4096
  validation_batch_size: 4096
  num_workers: 16

callbacks:
  - type: 'thomson_image'
    ds_key: 'STEREO_A_COR2'
  - type: 'thomson_image'
    ds_key: 'STEREO_B_COR2'
  - type: 'thomson_image'
    ds_key: 'LASCO_C2'
  - type: 'thomson_image'
    ds_key: 'LASCO_C2_CLEAR'
  - type: 'correction_image'
    ds_key: 'STEREO_A_COR2'
  - type: 'correction_image'
    ds_key: 'STEREO_B_COR2'
  - type: 'correction_image'
    ds_key: 'LASCO_C2'
  - type: 'correction_image'
    ds_key: 'LASCO_C2_CLEAR'
  - type: radial_slices
    ds_key: valid_radial

  - type: longitude_density
    ds_key: valid_lon_slices


logging:
  entity: "robert_jarolim"
  project: "sunerf-cme-obs-v4"
  name: "2010-03 CME - COR2 + LASCO"

sampling:
  type: "spherical"
  n_samples: 64
  max_distance: 17.0
  radial_weighting: False

lambda:
  image: 1.0
  ratio: 0.0
  radial: 1.0e-4
  continuity: 1.0e-3
  velocity: 1.0e-1

training:
  log_every_n_steps: 10000
  physics_update_interval: 1
