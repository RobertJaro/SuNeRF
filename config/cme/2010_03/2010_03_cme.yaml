base_path: "/glade/work/rjarolim/sunerf-cme-obs/2010_03_cme_v05"
work_directory: '/glade/derecho/scratch/rjarolim/sunerf-cme-obs/2010_03_cme_v05'

# Per-channel additive and multiplicative image-plane corrections per instrument;
# LASCO C2 clear provides tB only.
instruments:
  - type: 'default'
    key: 'STEREO_A_COR2'
    scaling: { type: "asinh", a: 1.0e-3 }
    correction:
      corrections: [tB_add, pB_add, tB_mul, pB_mul]
      additive_parametrization: exp  # add = scale * a * exp(b), sign carried by a
      additive_scale: 1.0e-3
  - type: 'default'
    key: 'STEREO_B_COR2'
    scaling: { type: "asinh", a: 1.0e-3 }
    correction:
      corrections: [tB_add, pB_add, tB_mul, pB_mul]
      additive_parametrization: exp  # add = scale * a * exp(b), sign carried by a
      additive_scale: 1.0e-3
  - type: 'default'
    key: 'LASCO_C2'
    scaling: { type: "asinh", a: 1.0e-3 }
    correction:
      corrections: [tB_add, pB_add, tB_mul, pB_mul]
      additive_parametrization: exp  # add = scale * a * exp(b), sign carried by a
      additive_scale: 1.0e-3
  - type: 'default'
    key: 'LASCO_C2_CLEAR'
    scaling: { type: "asinh", a: 1.0e-3 }
    correction:
      corrections: [tB_add, tB_mul]
      additive_parametrization: exp  # add = scale * a * exp(b), sign carried by a
      additive_scale: 1.0e-3

# Long cold phase: the corrections must converge before the dynamic branch starts.
model:
  model_type: 'split_temporal'
  cold_steps: 10000
  warm_steps: 5000

module:
  lr_config: { start: 1.0e-3, end: 1.0e-4, iterations: 200000 }

data:
  ref_date: "2010-03-01T00:00:00"
  cme_time: &cme_time ["2010-03-19T00:00:00", "2010-03-21T00:00:00"]
  # Validation images use the observation closest to this time.
  valid_time: &valid_time "2010-03-20T00:00:00"
  # Each imager: full-month background dataset plus CME-window dataset.
  train_datasets:
    - type: 'COR'
      key: 'STEREO_A_COR2_background'
      instrument_key: 'STEREO_A_COR2'
      scaling_mask_config: { type: r2 }
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_a_cor2/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_a_cor2/tB/*"
      batch_size: 512
      debug: False
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_a_cor2_tB_correction.npy",
      pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_a_cor2_pB_correction.npy",
      clean: False }

    - type: 'COR'
      key: 'STEREO_B_COR2_background'
      instrument_key: 'STEREO_B_COR2'
      scaling_mask_config: { type: r2 }
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_b_cor2/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_b_cor2/tB/*"
      batch_size: 512
      debug: False
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_b_cor2_tB_correction.npy",
      pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_b_cor2_pB_correction.npy",
      clean: False }

    - type: 'LASCO'
      key: 'LASCO_C2_background'
      instrument_key: 'LASCO_C2'
      scaling_mask_config: { type: r2 }
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/lasco_c2/pB/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/lasco_c2/tB/*"
      batch_size: 512
      debug: False
      correction_config: { type: file,
      tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/lasco_c2_tB_correction.npy",
      pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/lasco_c2_pB_correction.npy",
      clean: False }

    - type: 'LASCO'
      key: 'LASCO_C2_CLEAR_background'
      instrument_key: 'LASCO_C2_CLEAR'
      scaling_mask_config: { type: r2 }
      data_path_pB: null
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/lasco_c2_clear/tB/*"
      batch_size: 512
      debug: False
      correction_config: { type: file,
      tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/lasco_c2_clear_tB_correction.npy",
      clean: False }

    - type: 'COR'
      key: 'STEREO_A_COR2_cme'
      instrument_key: 'STEREO_A_COR2'
      scaling_mask_config: { type: r2 }
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_a_cor2/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_a_cor2/tB/*"
      time_range: *cme_time
      batch_size: 512
      debug: False
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_a_cor2_tB_correction.npy",
      pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_a_cor2_pB_correction.npy",
      clean: False }

    - type: 'COR'
      key: 'STEREO_B_COR2_cme'
      instrument_key: 'STEREO_B_COR2'
      scaling_mask_config: { type: r2 }
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_b_cor2/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_b_cor2/tB/*"
      time_range: *cme_time
      batch_size: 512
      debug: False
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_b_cor2_tB_correction.npy",
      pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_b_cor2_pB_correction.npy",
      clean: False }

    - type: 'LASCO'
      key: 'LASCO_C2_cme'
      instrument_key: 'LASCO_C2'
      scaling_mask_config: { type: r2 }
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/lasco_c2/pB/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/lasco_c2/tB/*"
      time_range: *cme_time
      batch_size: 512
      debug: False
      correction_config: { type: file,
      tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/lasco_c2_tB_correction.npy",
      pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/lasco_c2_pB_correction.npy",
      clean: False }

    - type: 'LASCO'
      key: 'LASCO_C2_CLEAR_cme'
      instrument_key: 'LASCO_C2_CLEAR'
      scaling_mask_config: { type: r2 }
      data_path_pB: null
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/lasco_c2_clear/tB/*"
      time_range: *cme_time
      batch_size: 512
      debug: False
      correction_config: { type: file,
      tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/lasco_c2_clear_tB_correction.npy",
      clean: False }

    - type: 'random'
      key: 'random_background'
      radius_range: [1.5, 17.0]
      unit: 'solRad'
      batch_size: 2048
      volume_uniform_sampling: True
      radial_sampling_exponent: 1

    - type: 'random'
      key: 'random_cme'
      time_range: *cme_time
      radius_range: [1.5, 17.0]
      unit: 'solRad'
      batch_size: 2048
      volume_uniform_sampling: True
      radial_sampling_exponent: 1

  valid_datasets:
    - type: 'COR'
      key: 'STEREO_A_COR2'
      instrument_key: 'STEREO_A_COR2'
      scaling_mask_config: { type: r2 }
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_a_cor2/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_a_cor2/tB/*"
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_a_cor2_tB_correction.npy",
      pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_a_cor2_pB_correction.npy",
      clean: False }
      validation_time: *valid_time

    - type: 'COR'
      key: 'STEREO_B_COR2'
      instrument_key: 'STEREO_B_COR2'
      scaling_mask_config: { type: r2 }
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_b_cor2/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/stereo_b_cor2/tB/*"
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_b_cor2_tB_correction.npy",
      pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2010_03/prep/masks/stereo_b_cor2_pB_correction.npy",
      clean: False }
      validation_time: *valid_time

    - type: 'LASCO'
      key: 'LASCO_C2'
      instrument_key: 'LASCO_C2'
      scaling_mask_config: { type: r2 }
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/lasco_c2/pB/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/lasco_c2/tB/*"
      correction_config: { type: file,
      tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/lasco_c2_tB_correction.npy",
      pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/lasco_c2_pB_correction.npy",
      clean: False }
      validation_time: *valid_time

    - type: 'LASCO'
      key: 'LASCO_C2_CLEAR'
      instrument_key: 'LASCO_C2_CLEAR'
      scaling_mask_config: { type: r2 }
      data_path_pB: null
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/lasco_c2_clear/tB/*"
      correction_config: { type: file,
      tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/lasco_c2_clear_tB_correction.npy",
      clean: False }
      validation_time: *valid_time

    - key: valid_radial
      type: radial_slices
      radii: [3, 6, 9, 12, 15]

    - type: longitude_slices
      key: valid_lon_slices
      radius_range: [2.5, 17.0]

  Rs_per_ds: 15
  seconds_per_dt: 86400
  batch_size: 4096
  validation_batch_size: 4096
  num_workers: 4
  preprocess_workers: 32  # pool size for the initial FITS loading and ray construction

callbacks:
  - type: 'thomson_image'
    ds_key: 'STEREO_A_COR2'
  - type: 'thomson_image'
    ds_key: 'STEREO_B_COR2'
  - type: 'thomson_image'
    ds_key: 'LASCO_C2'
  - type: 'thomson_image'
    ds_key: 'LASCO_C2_CLEAR'

  - type: 'correction_image'
    ds_key: 'STEREO_A_COR2'
  - type: 'correction_image'
    ds_key: 'STEREO_B_COR2'
  - type: 'correction_image'
    ds_key: 'LASCO_C2'
  - type: 'correction_image'
    ds_key: 'LASCO_C2_CLEAR'

  - type: radial_slices
    ds_key: valid_radial

  - type: longitude_density
    ds_key: valid_lon_slices

logging:
  entity: "robert_jarolim"
  project: "sunerf-cme-obs-v4"
  name: "2010-03 - STEREO A/B COR2 + LASCO C2 - additive + multiplicative corrections"

sampling:
  type: "spherical"
  n_samples: 64
  max_distance: 17.0
  radial_weighting: True

lambda:
  image: 1.0
  ratio: 1.0
  # No priors on corrections; they would bias the static corona.
  tB_add: 0.0
  pB_add: 0.0
  tB_mul: 0.0
  pB_mul: 0.0
  radial: 1.0
  continuity: { start: 1.0e-2, end: 5.0e-4, iterations: 5.0e+4 }
  ballistic: 0 # { start: 1.0e-2, end: 5.0e-4, iterations: 5.0e+4 }
  velocity: 1.0

training:
  log_every_n_steps: 10000
