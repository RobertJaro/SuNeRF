base_path: "/glade/work/rjarolim/sunerf-cme-obs/2025_09_cme_v25"
work_directory: '/glade/derecho/scratch/rjarolim/sunerf-cme-obs/2025_09_cme_v25'

# Per-channel additive and multiplicative image-plane corrections per instrument;
# STEREO-A COR2 is the photometric reference (gain fixed at 1). LASCO adds a
# sky-fixed F-corona term (helioprojective) next to the detector-fixed ones.
instruments:
  - type: 'default'
    key: 'STEREO_A_COR2'
    scaling: { type: "asinh", a: 1.0e-3 }
    correction:
      corrections: [tB_add, pB_add, tB_mul, pB_mul]
      additive_parametrization: exp  # add = scale * a * exp(b), sign carried by a
      additive_scale: 1.0e-3
  - type: 'default'
    key: 'PUNCH'
    scaling: { type: "asinh", a: 1.0e-5 }
    correction:
      corrections: [tB_add, pB_add, tB_mul, pB_mul]
      additive_parametrization: exp  # add = scale * a * exp(b), sign carried by a
      additive_scale: 1.0e-5
  - type: 'default'
    key: 'CCOR'
    scaling: { type: "asinh", a: 1.0e-3 }
    correction:
      corrections: [tB_add, tB_mul]
      additive_parametrization: exp  # add = scale * a * exp(b), sign carried by a
      additive_scale: 1.0e-3
  - type: 'default'
    key: 'STEREO_A_COR2_CLEAR'
    scaling: { type: "asinh", a: 1.0e-3 }
    correction:
      corrections: [tB_add, tB_mul]
      additive_parametrization: exp  # add = scale * a * exp(b), sign carried by a
      additive_scale: 1.0e-3
  - type: 'default'
    key: 'LASCO_C2'
    scaling: { type: "asinh", a: 1.0e-3 }
    correction:
      corrections: [f_corona, tB_add, tB_mul]
      additive_parametrization: exp  # add = scale * a * exp(b), sign carried by a
      additive_scale: 1.0e-3
  - type: 'default'
    key: 'LASCO_C3'
    scaling: { type: "asinh", a: 1.0e-3 }
    correction:
      corrections: [f_corona, tB_add, tB_mul]
      additive_parametrization: exp  # add = scale * a * exp(b), sign carried by a
      additive_scale: 1.0e-3
  - type: 'insitu'
    key: 'PSP'
    calibration: False
  - type: 'insitu'
    key: 'SOLO'
    calibration: False

# Long cold phase: the corrections must converge before the dynamic branch starts.
model:
  model_type: 'split_temporal'
  cold_steps: 10000
  warm_steps: 5000

module:
  lr_config: { start: 1.0e-3, end: 1.0e-4, iterations: 200000 }

data:
  ref_date: "2025-09-01T00:00:00"
  cme_time: &cme_time ["2025-09-21T12:00:00", "2025-09-23T12:00:00"]
  # Validation images use the observation closest to this time.
  valid_time: &valid_time "2025-09-22T08:00:00"
  # Each imager: full-month background dataset plus CME-window dataset.
  train_datasets:
    - type: 'COR'
      key: 'STEREO_A_COR2_background'
      instrument_key: 'STEREO_A_COR2'
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/cor2/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/cor2/tB/*"
      batch_size: 512
      debug: False
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/masks/stereo_a_cor2_tB_correction.npy",
      pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/masks/stereo_a_cor2_pB_correction.npy",
      clean: False }

    - type: 'punch'
