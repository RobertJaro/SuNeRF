      instrument_key: 'PUNCH'
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep_stash/punch_pam/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep_stash/punch_pam/tB/*"
      batch_size: 512
      debug: False

    - type: 'CCOR'
      key: 'CCOR_background'
      instrument_key: 'CCOR'
      data_path_pB: null
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/ccor/*"
      batch_size: 512
      debug: False

    - type: 'COR'
      key: 'STEREO_A_COR2_CLEAR_background'
      instrument_key: 'STEREO_A_COR2_CLEAR'
      data_path_pB: null
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/cor2_clear/*"
      batch_size: 512
      debug: False
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/masks/stereo_a_cor2_tB_clear_correction.npy",
      clean: False }

    - type: 'LASCO'
      key: 'LASCO_C2_background'
      instrument_key: 'LASCO_C2'
      data_path_pB: null
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/lasco_c2/tB/*"
      batch_size: 512
      debug: False
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/masks/lasco_c2_tB_correction.npy",
      clean: False }

    - type: 'LASCO'
      key: 'LASCO_C3_background'
      instrument_key: 'LASCO_C3'
      data_path_pB: null
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/lasco_c3/tB/*"
      batch_size: 512
      debug: False
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/masks/lasco_c3_tB_correction.npy",
      clean: False }

    - type: 'COR'
      key: 'STEREO_A_COR2_cme'
      instrument_key: 'STEREO_A_COR2'
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/cor2/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/cor2/tB/*"
      time_range: *cme_time
      batch_size: 512
      debug: False
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/masks/stereo_a_cor2_tB_correction.npy",
      pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/masks/stereo_a_cor2_pB_correction.npy",
      clean: False }

    - type: 'punch'
      key: 'PUNCH_cme'
      instrument_key: 'PUNCH'
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep_stash/punch_pam/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep_stash/punch_pam/tB/*"
      time_range: *cme_time
      batch_size: 512
      debug: False

    - type: 'CCOR'
      key: 'CCOR_cme'
      instrument_key: 'CCOR'
      data_path_pB: null
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/ccor/*"
      time_range: *cme_time
      batch_size: 512
      debug: False

    - type: 'COR'
      key: 'STEREO_A_COR2_CLEAR_cme'
      instrument_key: 'STEREO_A_COR2_CLEAR'
      data_path_pB: null
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/cor2_clear/*"
      time_range: *cme_time
      batch_size: 512
      debug: False
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/masks/stereo_a_cor2_tB_clear_correction.npy",
      clean: False }

    - type: 'LASCO'
      key: 'LASCO_C2_cme'
      instrument_key: 'LASCO_C2'
      data_path_pB: null
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/lasco_c2/tB/*"
      time_range: *cme_time
      batch_size: 512
      debug: False
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/masks/lasco_c2_tB_correction.npy",
      clean: False }

    - type: 'LASCO'
      key: 'LASCO_C3_cme'
      instrument_key: 'LASCO_C3'
      data_path_pB: null
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/lasco_c3/tB/*"
      time_range: *cme_time
      batch_size: 512
      debug: False
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/masks/lasco_c3_tB_correction.npy",
      clean: False }

    - type: 'psp'
      key: 'PSP'
      instrument_key: 'PSP'
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/psp/psp_insitu_20250901_20251001.npz"
      batch_size: 512
      max_distance: 120.0

    - type: 'solar_orbiter'
      key: 'SOLO'
      instrument_key: 'SOLO'
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/solo/solo_insitu_20250901_20251001.npz"
      batch_size: 512
      max_distance: 120.0

    - type: 'random'
      key: 'random_background'
      radius_range: [1.5, 160.0]
      unit: 'solRad'
      batch_size: 2048
      volume_uniform_sampling: True
      radial_sampling_exponent: 1

    - type: 'random'
      key: 'random_cme'
      time_range: *cme_time
      radius_range: [1.5, 160.0]
      unit: 'solRad'
      batch_size: 2048
      volume_uniform_sampling: True
      radial_sampling_exponent: 1

  valid_datasets:
    - type: 'COR'
      key: 'STEREO_A_COR2'
      instrument_key: 'STEREO_A_COR2'
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/cor2/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/cor2/tB/*"
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/masks/stereo_a_cor2_tB_correction.npy",
      pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/masks/stereo_a_cor2_pB_correction.npy",
      clean: False }
      validation_time: *valid_time

    - type: 'punch'
      key: 'PUNCH'
      instrument_key: 'PUNCH'
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep_stash/punch_pam/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep_stash/punch_pam/tB/*"
      validation_time: *valid_time

    - type: 'CCOR'
      key: 'CCOR'
      instrument_key: 'CCOR'
      data_path_pB: null
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/ccor/*"
      validation_time: *valid_time

    - type: 'COR'
      key: 'STEREO_A_COR2_CLEAR'
      instrument_key: 'STEREO_A_COR2_CLEAR'
      data_path_pB: null
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/cor2_clear/*"
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/masks/stereo_a_cor2_tB_clear_correction.npy",
      clean: False }
      validation_time: *valid_time

    - type: 'LASCO'
      key: 'LASCO_C2'
      instrument_key: 'LASCO_C2'
      data_path_pB: null
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/lasco_c2/tB/*"
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/masks/lasco_c2_tB_correction.npy",
      clean: False }
      validation_time: *valid_time

    - type: 'LASCO'
      key: 'LASCO_C3'
      instrument_key: 'LASCO_C3'
      data_path_pB: null
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/lasco_c3/tB/*"
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/masks/lasco_c3_tB_correction.npy",
      clean: False }
      validation_time: *valid_time

    - key: valid_radial
      type: radial_slices
      radii: [3, 5, 10, 20, 50, 80]

    - type: longitude_slices
      key: valid_lon_slices
      radius_range: [2.5, 100.0]

    - type: 'psp'
      key: 'valid_psp'
      instrument_key: 'PSP'
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/psp/psp_insitu_20250901_20251001.npz"
      batch_size: 4096
      max_distance: 120.0

    - type: 'solar_orbiter'
      key: 'valid_solo'
      instrument_key: 'SOLO'
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2025_09/prep/solo/solo_insitu_20250901_20251001.npz"
      batch_size: 4096
      max_distance: 120.0

  Rs_per_ds: 100
  seconds_per_dt: 86400
  batch_size: 4096
  validation_batch_size: 4096
  num_workers: 4
  preprocess_workers: 32  # pool size for the initial FITS loading and ray construction

callbacks:
  - type: 'thomson_image'
    ds_key: 'STEREO_A_COR2'
  - type: 'thomson_image'
    ds_key: 'PUNCH'
  - type: 'thomson_image'
    ds_key: 'CCOR'
  - type: 'thomson_image'
    ds_key: 'STEREO_A_COR2_CLEAR'
  - type: 'thomson_image'
    ds_key: 'LASCO_C2'
  - type: 'thomson_image'
    ds_key: 'LASCO_C3'

  - type: 'correction_image'
    ds_key: 'STEREO_A_COR2'
  - type: 'correction_image'
    ds_key: 'PUNCH'
  - type: 'correction_image'
    ds_key: 'CCOR'
  - type: 'correction_image'
    ds_key: 'STEREO_A_COR2_CLEAR'
  - type: 'correction_image'
    ds_key: 'LASCO_C2'
  - type: 'correction_image'
    ds_key: 'LASCO_C3'

  - type: radial_slices
    ds_key: valid_radial

  - type: longitude_density
    ds_key: valid_lon_slices

  - type: insitu_timeseries
    ds_key: valid_psp
    name: PSP

  - type: insitu_timeseries
    ds_key: valid_solo
    name: SOLO

logging:
  entity: "robert_jarolim"
  project: "sunerf-cme-obs-v4"
  name: "2025-09 - STEREO A COR2 (+ clear) + PUNCH (stash) + CCOR + LASCO C2/C3 - additive + multiplicative corrections + calibration factors - no ballistic"

# Integrate past the 120 R_sun PUNCH mask to limit truncation at the field edge.
sampling:
  type: "spherical"
  n_samples: 64
  max_distance: 150.0
  radial_weighting: True

lambda:
  image: 1.0
  ratio: 1.0
  # No priors on corrections or gains; they would bias the static corona.
  tB_add: 0.0
  pB_add: 0.0
  tB_mul: 0.0
  pB_mul: 0.0
  calibration: 0.0
  radial: 1.0
  continuity: { start: 1.0e-2, end: 5.0e-4, iterations: 5.0e+4 }
  ballistic: 0.0
  velocity: 1.0
  insitu_density: 0.0
  insitu_velocity_radial: 0.0

training:
  log_every_n_steps: 10000

