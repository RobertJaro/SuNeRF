base_path: "/glade/work/rjarolim/sunerf-cme-obs/202409_metis_static_v01"
work_directory: '/glade/derecho/scratch/rjarolim/sunerf-cme-obs/202409_metis_static_v01'

instruments:
  - type: 'default'
    key: 'Metis'
    scaling: {type: 'log'}
    correction: True
    calibration: False

model:
  dim: 128
  n_layers: 5
  static: False
  encoding_config: {type: multi_spectral, weights: [10, 10, 10, 1]}

data:
  train_datasets:
    - type: 'Metis'
      key: 'Metis'
      instrument_key: 'Metis'
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/2024_10/prep/metis/pB/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2024_10/prep/metis/tB/*"
      batch_size: 1024
      debug: False
  valid_datasets:
    - type: 'Metis'
      key: 'Metis_sample'
      instrument_key: 'Metis'
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/2024_10/prep/metis/pB/solo_L2_metis-vl-pb_20240915T003001_V01.fits"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2024_10/prep/metis/tB/solo_L2_metis-vl-tb_20240915T003001_V01.fits"
    - type: 'series'
      name: 'series'
      batch_size: 16384
      radius_range: [ 1.7, 5.0 ]
  debug: False
  Rs_per_ds: 15
  seconds_per_dt: 2356585.92
  batch_size: 4096
  validation_batch_size: 4096
  num_workers: 16

callbacks:
  # image callbacks
  - type: 'thomson_image'
    ds_key: 'Metis_sample'
  # correction images
  - type: 'correction_image'
    ds_key: 'Metis_sample'
  - type: 'velocity_slice'
    name: 'velocity_slice'
    ds_key: 'series'
    latitude: 0

logging:
  entity: "robert_jarolim"
  project: "sunerf-cme-obs"
  name: "2024-10 - Metis - static"

sampling:
  type: "spherical"
  n_samples: 64
  max_distance: 6.0

lambda:
  image: 1.0
  ratio: 10.0

training:
  log_every_n_steps: 1000