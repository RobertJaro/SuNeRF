base_path: "/glade/work/rjarolim/sunerf-cme-obs/2026_04_v11"
work_directory: '/glade/derecho/scratch/rjarolim/sunerf-cme-obs/2026_04_v11'

instruments:
  - type: 'default'
    key: 'STEREO_A_COR2'
    scaling: { type: "asinh", a: 1.0e-3 }
    correction: { corrections: [ 'f_corona', 'pB_add', 'tB_add', 'pB_mul', 'tB_mul' ] }
  - type: 'default'
    key: 'CCOR'
    scaling: { type: "asinh", a: 1.0e-3 }
    correction: { corrections: [ 'f_corona', 'tB_add', 'tB_mul' ] }

model:
  model_type: 'split_temporal'
  cold_steps: 2000
  warm_steps: 2000

module:
  ballistic_acceleration_limit_ms2: 1.0

data:
  # Keep the time coordinate identical when initializing the CME-stage model.
  ref_date: "2026-04-01T00:00:00"
  train_datasets:
    - type: 'COR'
      key: 'STEREO_A_COR2'
      instrument_key: 'STEREO_A_COR2'
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2026_04/prep/cor2/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2026_04/prep/cor2/tB/*"
      cadence: "1h"
      batch_size: 1024
      debug: False
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2026_04/prep/masks/stereo_a_cor2_tB_correction.npy",
      pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2026_04/prep/masks/stereo_a_cor2_pB_correction.npy",
      clean: False }

    - type: 'CCOR'
      key: 'CCOR'
      instrument_key: 'CCOR'
      data_path_pB: null
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2026_04/prep/ccor/*"
      cadence: "1h"
      batch_size: 1024
      debug: False

    - type: 'random'
      name: 'continuity'
      radius_range: [ 1.5, 27.0 ]
      unit: 'solRad'
      batch_size: 4096
      volume_uniform_sampling: True

  valid_datasets:
    - type: 'COR'
      key: 'STEREO_A_COR2'
      instrument_key: 'STEREO_A_COR2'
      data_path_pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2026_04/prep/cor2/pB/*"
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2026_04/prep/cor2/tB/*"
      correction_config: { type: file,
      tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2026_04/prep/masks/stereo_a_cor2_tB_correction.npy",
      pB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2026_04/prep/masks/stereo_a_cor2_pB_correction.npy",
      clean: False }

    - type: 'CCOR'
      key: 'CCOR'
      instrument_key: 'CCOR'
      data_path_pB: null
      data_path_tB: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_CME_OBS/2026_04/prep/ccor/*"

    - key: valid_radial
      type: radial_slices
      radii: [3, 6, 9, 12, 15]
      n_times: 5

    - type: longitude_slices
      key: valid_lon_slices
      radius_range: [2.0, 22.0]
      n_times: 5

  Rs_per_ds: 20
  seconds_per_dt: 86400
  batch_size: 4096
  validation_batch_size: 4096
  num_workers: 16

callbacks:
  - type: 'thomson_image'
    ds_key: 'STEREO_A_COR2'
  - type: 'thomson_image'
    ds_key: 'CCOR'

  - type: 'correction_image'
    ds_key: 'STEREO_A_COR2'
  - type: 'correction_image'
    ds_key: 'CCOR'

  - type: radial_slices
    ds_key: valid_radial

  - type: longitude_density
    ds_key: valid_lon_slices

logging:
  entity: "robert_jarolim"
  project: "sunerf-cme-obs-v4"
  name: "2026-04 - STEREO A COR2 + CCOR"

sampling:
  type: "spherical"
  n_samples: 64
  max_distance: 25.0
  radial_weighting: False

lambda:
  image: 1.0
  ratio: 0.0
  radial: { type: step, steps: 4000, start: 0.0, end: 1.0e-4 }
  continuity: { type: step, steps: 4000, start: 0.0, end: 1.0e-4 }
  ballistic: { type: step, steps: 4000, start: 0.0, end: 1.0e-4 }
  velocity: { type: step, steps: 4000, start: 0.0, end: 1.0e-2 }
