base_path: "/glade/work/rjarolim/sunerf-cme-obs/2010_03_cor2_subtracted_v04"
work_directory: '/glade/derecho/scratch/rjarolim/sunerf-cme-obs/2010_03_cor2_subtracted_v04'

instruments:
  - type: 'default'
    key: 'STEREO_A_COR2'
    scaling: {type: 'asinh', a: 1.0e-2}
    correction: { corrections: ['tB_add', 'pB_add'] }
#    correction: { corrections: ['pB_mul', 'tB_mul'] }
#    calibration: False
#    background: True
  - type: 'default'
    key: 'STEREO_B_COR2'
    scaling: {type: 'asinh', a: 1.0e-2}
    correction: { corrections: ['tB_add', 'pB_add'] }
#    correction: { corrections: ['pB_mul', 'tB_mul'] }
    calibration: True
#    background: True

model:
  dim: 128
  static: False
  encoding_config: { type: multi_spectral, weights: [ 30, 30, 30, 1.0 ], num_dims: [32, 32, 32, 4] }
  use_carrington_projection: True

data:
  train_datasets:
    - type: 'COR'
      key: 'STEREO_A_COR2'
      instrument_key: 'STEREO_A_COR2'
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/stereo_a_cor2/pB/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/stereo_a_cor2/tB/*"
      batch_size: 1024
      debug: False
      correction_config: { type: file, tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/stereo_a_cor2_tB_correction.npy", pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/stereo_a_cor2_pB_correction.npy", clean: False }
    - type: 'COR'
      key: 'STEREO_B_COR2'
      instrument_key: 'STEREO_B_COR2'
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/stereo_b_cor2/pB/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/stereo_b_cor2/tB/*"
      batch_size: 1024
      debug: False
      correction_config: { type: file, tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/stereo_b_cor2_tB_correction.npy", pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/stereo_b_cor2_pB_correction.npy", clean: False }
    - type: 'random'
      name: 'continuity'
      radius_range: [ 2.5, 17.0 ]
      unit: 'solRad'
      batch_size: 4096
  valid_datasets:
    # 1) Standard instrument validation (renders images)
    - type: 'COR'
      key: 'STEREO_A_COR2'
      instrument_key: 'STEREO_A_COR2'
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/stereo_a_cor2/pB/20100319_200815_1P4c2A.fts"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/stereo_a_cor2/tB/20100319_200815_1B4c2A.fts"
      correction_config: {type: file, tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/stereo_a_cor2_tB_correction.npy", pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/stereo_a_cor2_pB_correction.npy", clean: False }

    - type: 'COR'
      key: 'STEREO_B_COR2'
      instrument_key: 'STEREO_B_COR2'
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/stereo_b_cor2/pB/20100319_200815_1P4c2B.fts"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/stereo_b_cor2/tB/20100319_200815_1B4c2B.fts"
      correction_config: { type: file, tB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/stereo_b_cor2_tB_correction.npy", pB: "/glade/work/rjarolim/data/sunerf-cme/2010_03/prep/masks/stereo_b_cor2_pB_correction.npy", clean: False }


    - key: valid_radial
      type: radial_slices
      radii: [3, 6, 9, 12, 15]
    - type: longitude_slices
      key: valid_lon_slices
      radius_range: [ 2.5, 17.0 ]


  Rs_per_ds: 15
  seconds_per_dt: 86400
  batch_size: 4096
  validation_batch_size: 4096
  num_workers: 16

callbacks:
  # image callbacks
  - type: 'thomson_image'
    ds_key: 'STEREO_A_COR2'
  - type: 'thomson_image'
    ds_key: 'STEREO_B_COR2'
  # correction images
  - type: 'correction_image'
    ds_key: 'STEREO_A_COR2'
  - type: 'correction_image'
    ds_key: 'STEREO_B_COR2'

  - type: radial_slices
    ds_key: valid_radial

  - type: longitude_density
    ds_key: valid_lon_slices

logging:
  entity: "robert_jarolim"
  project: "sunerf-cme-obs"
  name: "2010-03 - COR2 - subtracted"

sampling:
  type: "spherical"
  n_samples: 64
  max_distance: 17.0

lambda:
  image: 1.0
  ratio: 1.0
  radial: 1.0e-2
  continuity: 1.0e-2
  velocity: 1.0e-2
  tB_add: 1.0e-2
  pB_add: 1.0e-2

training:
  log_every_n_steps: 2000