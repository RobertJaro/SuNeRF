base_path: "/glade/work/rjarolim/sunerf-cme-obs/202409_cor2_static_v03"
work_directory: '/glade/derecho/scratch/rjarolim/sunerf-cme-obs/202409_cor2_static_v01'

instruments:
  - type: 'default'
    key: 'COR2'
    scaling: {type: 'log'}
    correction: True
    calibration: False

model:
  dim: 128
  static: False
  encoding_config: {type: multi_spectral, weights: [10, 10, 10, 1]}

data:
  train_datasets:
    - type: 'COR'
      key: 'COR2'
      instrument_key: 'COR2'
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/2024_10/prep/cor2/pB/*"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2024_10/prep/cor2/tB/*"
      batch_size: 1024
      debug: False
  valid_datasets:
    - type: 'COR'
      key: 'COR2_sample'
      instrument_key: 'COR2'
      data_path_pB: "/glade/work/rjarolim/data/sunerf-cme/2024_10/prep/cor2/pB/20240915_000745_1P4c2A.fts"
      data_path_tB: "/glade/work/rjarolim/data/sunerf-cme/2024_10/prep/cor2/tB/20240915_000745_1B4c2A.fts"
    - type: 'series'
      name: 'series'
      batch_size: 16384
      radius_range: [ 1.5, 15.0 ]
  debug: False
  Rs_per_ds: 15
  seconds_per_dt: 2356585.92
  batch_size: 4096
  validation_batch_size: 4096
  num_workers: 16

callbacks:
  # image callbacks
  - type: 'thomson_image'
    ds_key: 'COR2_sample'
  # correction images
  - type: 'correction_image'
    ds_key: 'COR2_sample'
  - type: 'velocity_slice'
    name: 'velocity_slice'
    ds_key: 'series'
    latitude: 0

logging:
  entity: "robert_jarolim"
  project: "sunerf-cme-obs"
  name: "2024-10 - COR2 - static"

sampling:
  type: "spherical"
  n_samples: 64
  max_distance: 17.0

lambda:
  image: 1.0
  ratio: 10.0

training:
  log_every_n_steps: 1000