work_directory: "/glade/derecho/scratch/rjarolim/sunerf/2023_03_v01"

data:
  data_config:
    - type: 'AIA'
      key: 'AIA_FD'
      data_path: '/glade/work/rjarolim/data/sunerf/2023_03/prep/aia_fd/*.fits'
    - type: 'AIA'
      key: 'AIA_SUB'
      data_path: '/glade/work/rjarolim/data/sunerf/2023_03/prep/aia_sub/*.fits'
      batch_size: 128
