  debug: False
  batch_size: 512
  validation_batch_size: 1024
  num_workers: 16

logging:
  project: "sunerf"
  name: "2023-03 subframe"

training:
  log_every_n_steps: 10000

model:
  model_config:
    dim: 256
  image_scaling_config:
    AIA_FD: { vmax: 1.0 }
    AIA_SUB: { vmax: 1.0 }
  temperature_response_config:
    AIA_FD: { file: '/glade/work/rjarolim/sunerf/response/aia_interpolated.npz', scaling: 0.0, learnable: False }
    AIA_SUB: { file: '/glade/work/rjarolim/sunerf/response/aia_interpolated.npz', scaling: 0.0, learnable: False }
