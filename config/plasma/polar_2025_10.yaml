schema_version: 2

# Solar Orbiter polar validation, north pass October 2025: trained on AIA and
# EUVI-A, with EUI FSI 174 (peak +16.8 deg latitude on 10-14) held out.
base_path: "/glade/work/rjarolim/sunerf/polar_2025_10_plasma_v01"
work_directory: "/glade/derecho/scratch/rjarolim/sunerf/polar_2025_10_plasma_v01"

instruments:
  - type: "plasma"
    key: "AIA"
    scaling: {type: "log", divisor: "builtin:image_scaling"}
    # Enable after preparing again (PEAK_DN).
    # saturation_dn: 13000
    temperature_response:
      artifact: "builtin:aia"
      channels: ["A94", "A131", "A171", "A193", "A211", "A335"]
      learnable: true
      global_reference: true
      reference_channel: "A193"
      gain_limit_dex: 0.15
      common_gain_limit_dex: 0.3

  - type: "plasma"
    key: "EUVI-A"
    scaling: {type: "log", divisor: "builtin:image_scaling"}
    # saturation_dn: 13000
    temperature_response:
      artifact: "builtin:euvi_a"
      channels: ["171", "195", "284"]
      learnable: true
      reference_channel: "195"
      gain_limit_dex: 0.15
      common_gain_limit_dex: 0.3

  # Held-out instrument with untrained gain; 304 is excluded (no cool plasma).
  - type: "plasma"
    key: "EUI"
    scaling: {type: "log", divisor: "builtin:image_scaling"}
    # saturation_dn: null
    temperature_response:
      artifact: "builtin:eui_fsi"
      channels: ["174"]
      learnable: false

data:
  Rs_per_ds: 1.0
  seconds_per_dt: 86400.0
  batch_size: 512
  validation_batch_size: 512
  num_workers: 4
  preparation_workers: 16
  debug: false

  train_datasets:
    - type: "AIA"
      key: "AIA"
      instrument_key: "AIA"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SUNERF_POLAR/data_2025_10/prepared/aia/*.prepared.fits"
      wavelengths: [94, 131, 171, 193, 211, 335]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25
      cadence_minutes: 60

    # Focus: 5 days centered on the Solar Orbiter latitude maximum, one batch
    # per step alongside the full interval (1:1).
    - type: "AIA"
      key: "AIA-focus"
      instrument_key: "AIA"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SUNERF_POLAR/data_2025_10/prepared/aia/*.prepared.fits"
      wavelengths: [94, 131, 171, 193, 211, 335]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25
      cadence_minutes: 60
      start: "2025-10-11T21:00:00"
      end: "2025-10-16T21:00:00"

    - type: "EUVI"
      key: "EUVI-A"
      instrument_key: "EUVI-A"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SUNERF_POLAR/data_2025_10/prepared/euvi_a/*.prepared.fits"
      wavelengths: [171, 195, 284]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25

    - type: "EUVI"
      key: "EUVI-A-focus"
      instrument_key: "EUVI-A"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SUNERF_POLAR/data_2025_10/prepared/euvi_a/*.prepared.fits"
      wavelengths: [171, 195, 284]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25
      start: "2025-10-11T21:00:00"
      end: "2025-10-16T21:00:00"

  valid_datasets:
    # One frame per view at the Solar Orbiter latitude maximum.
    - type: "AIA"
      key: "AIA"
      instrument_key: "AIA"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SUNERF_POLAR/data_2025_10/prepared/aia/*.prepared.fits"
      wavelengths: [94, 131, 171, 193, 211, 335]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25
      time: "2025-10-14T09:00:00"

    - type: "EUVI"
      key: "EUVI-A"
      instrument_key: "EUVI-A"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SUNERF_POLAR/data_2025_10/prepared/euvi_a/*.prepared.fits"
      wavelengths: [171, 195, 284]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25
      time: "2025-10-14T09:00:00"

    # Validation-only view; never trained on.
    - type: "EUI"
      key: "EUI"
      instrument_key: "EUI"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SUNERF_POLAR/data_2025_10/prepared/eui/*.prepared.fits"
      wavelengths: [174]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25
      time: "2025-10-14T09:00:00"

model:
  type: "mlp"
  density_offset_log10_cm3: 8.0
  # Hydrostatic baseline with the scale height of the local temperature.
  density_profile: {type: "hydrostatic_thermal"}
  # Network output tapers to zero between this radius and the shell edge.
  supervised_radius_rsun: 1.4
  temperature_grid:
    log10_K_min: 5.4
    log10_K_max: 7.5
    step_dex: 0.05
  initial_log_T: 6.1
  dim: 512
  n_layers: 8
  activation: "swish"
  encoding: "positional_isotropic"
  num_frequencies: [256, 80]
  min_frequencies: [0, -4]
  max_frequencies: [9, 5]

module:
  regularization_density_scale_cm3: 1.0e8
  # EM prior is zero inside this range, full weight at the temperature_grid bounds.
  regularization_log_T_range: [5.7, 7.0]
  light_travel_time: true
  lr_config:
    start: 1.0e-3
    end: 1.0e-4
    iterations: 1000000

sampling:
  type: "spherical"
  # Opaque sphere at the EUV limb instead of the photosphere.
  min_distance: 1.007
  # Must overshoot the 1.4 R_sun field of view of the prepared images.
  max_distance: 1.7
  # Raise to 96 if disk-center residuals come out systematically biased.
  n_samples: 64
  perturb: true

hierarchical_sampling:
  type: "hierarchical"
  n_samples: 128
  perturb: true

absorption:
  type: null

# Gaussian time jitter: 7 days for 10k steps, then decaying linearly to 0.
shuffle:
  type: "normal_time"
  start_seconds: 604800.0
  end_seconds: 0.0
  iterations: 10000
  cold_iterations: 10000

training:
  epochs: 1000
  log_every_n_steps: 2000
  check_val_every_n_epoch: 1
  meta_path: "last"

logging:
  project: "sunerf"
  name: "2025-10 polar validation: AIA + EUVI-A train, EUI FSI 174 held out"

callbacks:
  euv_tomography:
    enabled: true
    every_n_validations: 1
    figure_dpi: 150
    datasets:
      AIA:
        channels: [A94, A131, A171, A193, A211, A335]
      EUVI-A:
        channels: [171, 195, 284]
      EUI:
        channels: ["174"]
        # Match prediction mean and std to the observation (no trained gain).
        normalize: true
    products:
      channel_comparison:
        enabled: true
        rows: [observation, prediction, residual]
        intensity_percentile: 99.5
        residual_percentile: 99.0
      plasma_diagnostics:
        enabled: true
        quantities:
          - mean_log_temperature
          - column_electron_density
          - emission_measure
          - emission_height
          - absorption_fraction
      thermal_distribution:
        enabled: true
        spatial_statistic: median
        percentile_band: [16, 84]
      response_and_gains:
        enabled: true
      ray_sampling:
        enabled: false
        pixel_fraction: [0.25, 0.25]

lambda:
  image: 1.0
  # Emission-measure prior on the temperature edges; untuned.
  regularization: 0.0
  absorption: 0.0
  calibration: 0.0
