schema_version: 2

# Closed-loop test on synthetic AIA/EUVI observations rendered from PSI/MAS
# (scripts/psi_euv/render.sh), with the plasma base of polar_2025_10.yaml.
# The synthetic gains are exactly one; the learned gains must stay near one.
base_path: "/glade/work/rjarolim/sunerf/psi_euv_v02"
work_directory: "/glade/derecho/scratch/rjarolim/sunerf/psi_euv_v02"

instruments:
  - type: "plasma"
    key: "AIA"
    scaling: {type: "log", divisor: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_2023_03/psi_data/psi_euv/observers_v02/image_scaling.yaml"}
    temperature_response:
      artifact: "builtin:aia"
      channels: ["A94", "A131", "A171", "A193", "A211", "A335"]
      learnable: true
      global_reference: true
      reference_channel: "A193"
      gain_limit_dex: 0.15
      common_gain_limit_dex: 0.3

  - type: "plasma"
    key: "EUVI-A"
    scaling: {type: "log", divisor: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_2023_03/psi_data/psi_euv/observers_v02/image_scaling.yaml"}
    temperature_response:
      artifact: "builtin:euvi_a"
      channels: ["171", "195", "284"]
      learnable: true
      reference_channel: "195"
      gain_limit_dex: 0.15
      common_gain_limit_dex: 0.3

  - type: "plasma"
    key: "EUVI-B"
    scaling: {type: "log", divisor: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_2023_03/psi_data/psi_euv/observers_v02/image_scaling.yaml"}
    temperature_response:
      artifact: "builtin:euvi_b"
      channels: ["171", "195", "284"]
      learnable: true
      reference_channel: "195"
      gain_limit_dex: 0.15
      common_gain_limit_dex: 0.3

data:
  # Mandatory: one model distance unit is 1 R_sun, one time unit is 1 day.
  Rs_per_ds: 1.0
  seconds_per_dt: 86400.0
  batch_size: 512
  validation_batch_size: 512
  num_workers: 4
  preparation_workers: 4
  debug: false

  # One dataset per rendered observer; training uses Earth, L4 and L5.
  train_datasets:
    - type: "AIA"
      key: "AIA-earth"
      instrument_key: "AIA"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_2023_03/psi_data/psi_euv/observers_v02/aia_earth/*.prepared.fits"
      wavelengths: [94, 131, 171, 193, 211, 335]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25

    - type: "EUVI"
      key: "EUVI-A-L4"
      instrument_key: "EUVI-A"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_2023_03/psi_data/psi_euv/observers_v02/euvi_a_l4/*.prepared.fits"
      wavelengths: [171, 195, 284]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25

    - type: "EUVI"
      key: "EUVI-B-L5"
      instrument_key: "EUVI-B"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_2023_03/psi_data/psi_euv/observers_v02/euvi_b_l5/*.prepared.fits"
      wavelengths: [171, 195, 284]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25

  # The polar view (EUVI-A-north) is validation only.
  valid_datasets:
    - type: "AIA"
      key: "AIA-earth"
      instrument_key: "AIA"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_2023_03/psi_data/psi_euv/observers_v02/aia_earth/*.prepared.fits"
      wavelengths: [94, 131, 171, 193, 211, 335]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25
      time: "2026-01-01T01:00:00"

    - type: "EUVI"
      key: "EUVI-A-L4"
      instrument_key: "EUVI-A"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_2023_03/psi_data/psi_euv/observers_v02/euvi_a_l4/*.prepared.fits"
      wavelengths: [171, 195, 284]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25
      time: "2026-01-01T01:00:00"

    - type: "EUVI"
      key: "EUVI-B-L5"
      instrument_key: "EUVI-B"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_2023_03/psi_data/psi_euv/observers_v02/euvi_b_l5/*.prepared.fits"
      wavelengths: [171, 195, 284]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25
      time: "2026-01-01T01:00:00"

    - type: "EUVI"
      key: "EUVI-A-north"
      instrument_key: "EUVI-A"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SuNeRF_2023_03/psi_data/psi_euv/observers_v02/euvi_a_north/*.prepared.fits"
      wavelengths: [171, 195, 284]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25
      time: "2026-01-01T01:00:00"

model:
  type: "mlp"
  density_offset_log10_cm3: 8.0
  # Hydrostatic baseline with the scale height of the local temperature.
  density_profile: {type: "hydrostatic_thermal"}
  # Network output tapers to zero between this radius and the shell edge.
  supervised_radius_rsun: 1.4
  temperature_grid:
    log10_K_min: 5.4
    log10_K_max: 7.5
    step_dex: 0.05
  initial_log_T: 6.1
  dim: 512
  n_layers: 8
  activation: "swish"
  encoding: "positional_isotropic"
  num_frequencies: [256, 80]
  min_frequencies: [0, -4]
  max_frequencies: [9, 5]

module:
  regularization_density_scale_cm3: 1.0e8
  # EM prior is zero inside this range, full weight at the temperature_grid bounds.
  regularization_log_T_range: [5.7, 7.0]
  light_travel_time: true
  lr_config:
    start: 1.0e-3
    end: 1.0e-4
    iterations: 1000000

sampling:
  type: "spherical"
  # Opaque sphere at the EUV limb instead of the photosphere.
  min_distance: 1.007
  # Must overshoot the 1.4 R_sun field of view of the prepared images.
  max_distance: 1.7
  # Raise to 96 if disk-center residuals come out systematically biased.
  n_samples: 64
  perturb: true

hierarchical_sampling:
  type: "hierarchical"
  n_samples: 128
  perturb: true

absorption:
  type: null

# Gaussian time jitter: 7 days for 10k steps, then decaying linearly to 0.
shuffle:
  type: "normal_time"
  start_seconds: 604800.0
  end_seconds: 0.0
  iterations: 10000
  cold_iterations: 10000

training:
  epochs: 1000
  log_every_n_steps: 2000
  check_val_every_n_epoch: 1
  meta_path: "last"

logging:
  project: "sunerf"
  name: "PSI closed-loop explicit observers"

callbacks:
  euv_tomography:
    enabled: true
    every_n_validations: 1
    figure_dpi: 150
    datasets:
      AIA-earth:
        channels: [A94, A131, A171, A193, A211, A335]
      EUVI-A-L4:
        channels: [171, 195, 284]
      EUVI-B-L5:
        channels: [171, 195, 284]
      EUVI-A-north:
        channels: [171, 195, 284]
    products:
      channel_comparison:
        enabled: true
        rows: [observation, prediction, residual]
        intensity_percentile: 99.5
        residual_percentile: 99.0
      plasma_diagnostics:
        enabled: true
        quantities: [mean_log_temperature, column_electron_density, emission_measure,
          emission_height, absorption_fraction]
      thermal_distribution:
        enabled: true
        spatial_statistic: median
        percentile_band: [16, 84]
      response_and_gains: {enabled: true}
      ray_sampling:
        enabled: false
        pixel_fraction: [0.25, 0.25]

lambda:
  image: 1.0
  # Emission-measure prior on the temperature edges; untuned.
  regularization: 0.0
  absorption: 0.0
  calibration: 0.0
