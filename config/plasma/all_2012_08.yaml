schema_version: 2

# Pointwise density/temperature reconstruction with H/He photoionization
# absorption and a cool absorber field; shares the plasma base of
# polar_2025_10_absorption.yaml. The recovered n_e is an RMS density.
base_path: "/glade/work/rjarolim/sunerf/all_2012_08_plasma_absorption_v01"
work_directory: "/glade/derecho/scratch/rjarolim/sunerf/all_2012_08_plasma_absorption_v01"

instruments:
  - type: "plasma"
    key: "AIA"
    scaling: {type: "log", divisor: "builtin:image_scaling"}
    # Enable after preparing again (PEAK_DN).
    # saturation_dn: 13000
    temperature_response:
      artifact: "builtin:aia"
      channels: ["A94", "A131", "A171", "A193", "A211", "A335"]
      learnable: true
      # Gauge choice for the density/gain degeneracy, not an absolute calibration.
      global_reference: true
      reference_channel: "A193"
      gain_limit_dex: 0.15
      common_gain_limit_dex: 0.3

  - type: "plasma"
    key: "EUVI-A"
    scaling: {type: "log", divisor: "builtin:image_scaling"}
    # saturation_dn: 13000
    temperature_response:
      artifact: "builtin:euvi_a"
      channels: ["171", "195", "284"]
      learnable: true
      reference_channel: "195"
      gain_limit_dex: 0.15
      common_gain_limit_dex: 0.3

  - type: "plasma"
    key: "EUVI-B"
    # The packaged table has no EUVI-B entry yet.
    scaling: {type: "log", divisor: "/glade/campaign/hao/radmhd/rjarolim/SUNERF_POLAR/data_2012_08/prepared/image_scaling.yaml"}
    # saturation_dn: 13000
    temperature_response:
      artifact: "builtin:euvi_b"
      channels: ["171", "195", "284"]
      learnable: true
      reference_channel: "195"
      gain_limit_dex: 0.15
      common_gain_limit_dex: 0.3

data:
  # Mandatory: one model distance unit is 1 R_sun, one time unit is 1 day.
  Rs_per_ds: 1.0
  seconds_per_dt: 86400.0
  batch_size: 512
  validation_batch_size: 512
  num_workers: 4
  preparation_workers: 16
  debug: false

  train_datasets:
    - type: "AIA"
      key: "AIA"
      instrument_key: "AIA"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SUNERF_POLAR/data_2012_08/prepared/aia/*.prepared.fits"
      wavelengths: [94, 131, 171, 193, 211, 335]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25

    - type: "EUVI"
      key: "EUVI-A"
      instrument_key: "EUVI-A"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SUNERF_POLAR/data_2012_08/prepared/euvi_a/*.prepared.fits"
      wavelengths: [171, 195, 284]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25

    - type: "EUVI"
      key: "EUVI-B"
      instrument_key: "EUVI-B"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SUNERF_POLAR/data_2012_08/prepared/euvi_b/*.prepared.fits"
      wavelengths: [171, 195, 284]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25

  # The center observation is held out from training.
  valid_datasets:
    - type: "AIA"
      key: "AIA"
      instrument_key: "AIA"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SUNERF_POLAR/data_2012_08/prepared/aia/*.prepared.fits"
      wavelengths: [94, 131, 171, 193, 211, 335]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25
      time: "2012-08-16T12:00:00"

    - type: "EUVI"
      key: "EUVI-A"
      instrument_key: "EUVI-A"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SUNERF_POLAR/data_2012_08/prepared/euvi_a/*.prepared.fits"
      wavelengths: [171, 195, 284]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25
      time: "2012-08-16T12:00:00"

    - type: "EUVI"
      key: "EUVI-B"
      instrument_key: "EUVI-B"
      data_path: "/glade/campaign/hao/radmhd/rjarolim/SUNERF_POLAR/data_2012_08/prepared/euvi_b/*.prepared.fits"
      wavelengths: [171, 195, 284]
      strict_metadata: true
      match_tolerance_minutes: 2
      alignment_tolerance_arcsec: 0.25
      time: "2012-08-16T12:00:00"

model:
  type: "mlp"
  density_offset_log10_cm3: 8.0
  # Hydrostatic baseline with the scale height of the local temperature.
  density_profile: {type: "hydrostatic_thermal"}
  # Network output tapers to zero between this radius and the shell edge.
  supervised_radius_rsun: 1.4
  temperature_grid:
    log10_K_min: 5.4
    log10_K_max: 7.5
    step_dex: 0.05
  initial_log_T: 6.1
  cool_absorber: true
  cool_density_offset_log10_cm3: 4.0
  dim: 512
  n_layers: 8
  activation: "swish"
  encoding: "positional_isotropic"
  num_frequencies: [256, 80]
  min_frequencies: [0, -4]
  max_frequencies: [9, 5]

module:
  regularization_density_scale_cm3: 1.0e8
  # EM prior is zero inside this range, full weight at the temperature_grid bounds.
  regularization_log_T_range: [5.7, 7.0]
  light_travel_time: true
  calibration_iterations: 10000
  lr_config:
    start: 1.0e-3
    end: 1.0e-4
    iterations: 1000000

sampling:
  type: "spherical"
  # Opaque sphere at the EUV limb instead of the photosphere.
  min_distance: 1.007
  # Must overshoot the 1.4 R_sun field of view of the prepared images.
  max_distance: 1.7
  # Raise to 96 if disk-center residuals come out systematically biased.
  n_samples: 64
  perturb: true

hierarchical_sampling:
  type: "hierarchical"
  n_samples: 128
  perturb: true

absorption:
  type: "photoionization"
  artifact: "builtin:h_he_photoionization"
  hydrogen_density_convention: "fully_ionized_proxy"
  cool_ion_fractions: {H_I: 0.7, He_I: 0.7, He_II: 0.3}

# Gaussian time jitter: 7 days for 10k steps, then decaying linearly to 0.
shuffle:
  type: "normal_time"
  start_seconds: 604800.0
  end_seconds: 0.0
  iterations: 10000
  cold_iterations: 10000

training:
  epochs: 1000
  log_every_n_steps: 2000
  check_val_every_n_epoch: 1
  meta_path: "last"

logging:
  project: "sunerf"
  name: "2012-08 AIA + EUVI-A + EUVI-B pointwise plasma + absorption"

callbacks:
  euv_tomography:
    enabled: true
    every_n_validations: 1
    figure_dpi: 150
    datasets:
      AIA:
        channels: [A94, A131, A171, A193, A211, A335]
      EUVI-A:
        channels: [171, 195, 284]
      EUVI-B:
        channels: [171, 195, 284]
    products:
      channel_comparison:
        enabled: true
        rows: [observation, prediction, residual]
        intensity_percentile: 99.5
        residual_percentile: 99.0
      plasma_diagnostics:
        enabled: true
        quantities:
          - mean_log_temperature
          - column_electron_density
          - emission_measure
          - emission_height
          - absorption_fraction
          - cool_hydrogen_column
      thermal_distribution:
        enabled: true
        spatial_statistic: median
        percentile_band: [16, 84]
      response_and_gains:
        enabled: true
      ray_sampling:
        enabled: false
        pixel_fraction: [0.25, 0.25]

lambda:
  image: 1.0
  # Emission-measure prior on the temperature edges; untuned.
  regularization: 0.0
  absorption: 0.0
  calibration: 0.0
  cool_absorber: 1.0e-4
